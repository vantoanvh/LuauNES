<!doctype html>
<!-- File to RBXMX client exporter UI and encoder. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>File to RBXMX</title>
  <style>
    :root {
      --bg: #050505;
      --panel: #0b0b0c;
      --surface: #101113;
      --surface-hover: #151619;
      --text: #f4f4f5;
      --muted: #8e929a;
      --border: rgba(255, 255, 255, 0.12);
      --border-strong: rgba(255, 255, 255, 0.2);
      --focus: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      align-items: center;
      justify-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, "Segoe UI Variable", "Segoe UI", Arial, sans-serif;
      padding: 16px;
      color-scheme: dark;
    }

    .panel {
      width: min(560px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.34);
    }

    .title {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .status {
      margin: 5px 0 16px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 96px;
      gap: 12px;
      align-items: stretch;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin: 14px 0 0;
    }

    .option {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 42px;
      gap: 12px;
      align-items: start;
      min-height: 86px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .option:hover,
    .option:has(.toggle-input:focus-visible) {
      border-color: var(--border-strong);
      background: var(--surface-hover);
    }

    .option:has(.toggle-input:disabled) {
      cursor: default;
      opacity: 0.48;
    }

    .option-text {
      min-width: 0;
    }

    .option-label,
    .option-meta,
    .option-description {
      display: block;
    }

    .option-label {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.15;
    }

    .option-meta {
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.15;
    }

    .option-description {
      margin-top: 6px;
      color: #b6bac2;
      font-size: 11px;
      line-height: 1.3;
      min-height: 29px;
    }

    .toggle-input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .toggle-track {
      position: relative;
      margin-top: 1px;
      width: 42px;
      height: 24px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #070708;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.5);
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .toggle-track::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--muted);
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .toggle-input:checked + .toggle-track {
      border-color: #f4f4f5;
      background: #f4f4f5;
    }

    .toggle-input:checked + .toggle-track::after {
      background: #050505;
      transform: translateX(18px);
    }

    .file-picker {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      min-height: 48px;
      padding: 7px;
      background: var(--surface);
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.045);
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .file-picker:hover,
    .file-input:focus-visible + .file-picker {
      border-color: var(--border-strong);
      background: var(--surface-hover);
    }

    .file-action,
    button {
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      line-height: 1;
    }

    .file-action {
      flex: 0 0 auto;
      padding: 8px 11px;
      font-weight: 600;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.055);
    }

    .file-details {
      min-width: 0;
      text-align: right;
    }

    .file-name,
    .file-size {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-name {
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.25;
    }

    .file-size {
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.2;
    }

    button {
      min-height: 48px;
      padding: 6px 9px;
      cursor: pointer;
      display: grid;
      place-items: center;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
    }

    .button-label,
    .button-meta {
      display: block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .button-label {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.15;
    }

    .button-meta {
      margin-top: 3px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.1;
    }

    button.primary {
      background: #f4f4f5;
      border-color: #f4f4f5;
      color: #050505;
      box-shadow: none;
    }

    button.primary .button-meta {
      color: #555960;
    }

    button:hover:not(:disabled) {
      border-color: var(--border-strong);
      background: var(--surface-hover);
      transform: translateY(1px);
    }

    button.primary:hover:not(:disabled) {
      background: #ffffff;
      border-color: #ffffff;
    }

    button:disabled {
      cursor: default;
      opacity: 0.42;
    }

    button:focus-visible {
      outline: none;
      box-shadow:
        0 0 0 3px var(--focus),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    @media (max-width: 560px) {
      .controls {
        grid-template-columns: 1fr;
      }

      .options {
        grid-template-columns: 1fr;
      }

      .option {
        min-height: 82px;
      }
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1 class="title">File to RBXMX</h1>
    <p id="statusText" class="status">Choose a file or ZIP. Export creates ModuleScripts that return the original bytes as a string or buffer.</p>

    <div class="controls">
      <input id="fileInput" class="file-input" type="file" />
      <label class="file-picker" for="fileInput">
        <span class="file-action">Choose File</span>
        <span class="file-details">
          <span id="fileName" class="file-name">Nothing loaded</span>
          <span id="fileSize" class="file-size">1 GB max</span>
        </span>
      </label>
      <button id="exportBtn" class="primary" type="button" disabled>
        <span class="button-label">Export</span>
        <span id="exportMeta" class="button-meta">RBXMX</span>
      </button>
    </div>

    <div class="options" aria-label="Encoding options">
      <label class="option">
        <span class="option-text">
          <span class="option-label">Zstd</span>
          <span class="option-meta">Compression</span>
          <span class="option-description">Compresses bytes to make the exported file smaller.</span>
        </span>
        <input id="zstdToggle" class="toggle-input" type="checkbox" />
        <span class="toggle-track" aria-hidden="true"></span>
      </label>
      <label class="option">
        <span class="option-text">
          <span class="option-label">Base64</span>
          <span class="option-meta">Format</span>
          <span class="option-description">Stores bytes as clean Base64 text for smaller scripts.</span>
        </span>
        <input id="base64Toggle" class="toggle-input" type="checkbox" checked />
        <span class="toggle-track" aria-hidden="true"></span>
      </label>
      <label class="option">
        <span class="option-text">
          <span class="option-label">Buffer</span>
          <span class="option-meta">Format</span>
          <span class="option-description">Returns a buffer directly instead of converting to string.</span>
        </span>
        <input id="returnBufferToggle" class="toggle-input" type="checkbox" checked />
        <span class="toggle-track" aria-hidden="true"></span>
      </label>
      <label class="option">
        <span class="option-text">
          <span class="option-label">No split lines</span>
          <span class="option-meta">No \z split</span>
          <span class="option-description">Keeps one long string for faster load, but risky to open.</span>
        </span>
        <input id="oneLineToggle" class="toggle-input" type="checkbox" />
        <span class="toggle-track" aria-hidden="true"></span>
      </label>
    </div>
  </main>

  <script>
    const fileInput = document.getElementById("fileInput");
    const fileName = document.getElementById("fileName");
    const fileSize = document.getElementById("fileSize");
    const statusText = document.getElementById("statusText");
    const exportBtn = document.getElementById("exportBtn");
    const exportMeta = document.getElementById("exportMeta");
    const zstdToggle = document.getElementById("zstdToggle");
    const base64Toggle = document.getElementById("base64Toggle");
    const returnBufferToggle = document.getElementById("returnBufferToggle");
    const oneLineToggle = document.getElementById("oneLineToggle");
    const MAX_FILE_BYTES = 1024 * 1024 * 1024;
    const BYTES_PER_LINE = 32;
    const BASE64_CHARS_PER_LINE = 128;
    const RBXMX_HEADER = `<roblox xmlns:xmime="http://www.w3.org/2005/05/xmlmime" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:noNamespaceSchemaLocation="http://www.roblox.com/roblox.xsd" version="4">\n`;
    const RBXMX_FOOTER = `</roblox>`;
    const ITEM_SOURCE_PREFIX = `\t<Item class="ModuleScript">\n\t\t<Properties>\n\t\t\t<Content name="LinkedSource"><null></null></Content>\n\t\t\t<ProtectedString name="Source"><![CDATA[`;
    const ITEM_NAME_PREFIX = `]]></ProtectedString>\n\t\t\t<string name="Name">`;
    const ITEM_SUFFIX = `</string>\n\t\t</Properties>\n\t</Item>\n`;
    const ENCODING_SERVICE_SOURCE = `local EncodingService = game:GetService("EncodingService")\n`;
    const RETURN_PREFIX = "return ";
    const BUFFER_TOSTRING_PREFIX = "buffer.tostring(";
    const BUFFER_FROMSTRING_PREFIX = "buffer.fromstring(";
    const BASE64_DECODE_PREFIX = "EncodingService:Base64Decode(";
    const ZSTD_DECODE_PREFIX = "EncodingService:DecompressBuffer(";
    const ZSTD_DECODE_SUFFIX = ", Enum.CompressionAlgorithm.Zstd)";
    const ZSTD_SCRIPT_SOURCE = "oneidentity-zstd.js";
    const ZSTD_COMPRESSION_LEVEL = 19;
    const ENCODING_WORKER_COUNT = Math.min(4, Math.max(1, ((typeof navigator === "object" ? navigator.hardwareConcurrency : 2) || 2) - 1));
    const ZSTD_WORKER_SOURCE = [
      "self.window = self;",
      "let zstdSimplePromise = null;",
      "async function getZstdSimple(codecUrl) {",
      "  if (zstdSimplePromise === null) {",
      "    zstdSimplePromise = (async () => {",
      "      importScripts(codecUrl);",
      "      if (!self.ZstdInit) throw new Error('Zstd codec did not initialize.');",
      "      const zstd = await self.ZstdInit();",
      "      return zstd.ZstdSimple;",
      "    })();",
      "  }",
      "  return zstdSimplePromise;",
      "}",
      "self.onmessage = async (event) => {",
      "  const { id, codecUrl, bytes, level } = event.data;",
      "  try {",
      "    const zstdSimple = await getZstdSimple(codecUrl);",
      "    const compressed = zstdSimple.compress(new Uint8Array(bytes), level);",
      "    if (!(compressed instanceof Uint8Array)) throw new Error('Zstd compression failed.');",
      "    const output = compressed.slice();",
      "    self.postMessage({ id, bytes: output }, [output.buffer]);",
      "  } catch (error) {",
      "    self.postMessage({ id, error: error instanceof Error ? error.message : String(error) });",
      "  }",
      "};",
    ].join("\n");
    const BASE64_WORKER_SOURCE = [
      "const CODES = new TextEncoder().encode('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/');",
      "function encode(bytes) {",
      "  const output = new Uint8Array(Math.ceil(bytes.length / 3) * 4);",
      "  let inputIndex = 0;",
      "  let outputIndex = 0;",
      "  while (inputIndex + 2 < bytes.length) {",
      "    const value = (bytes[inputIndex] << 16) | (bytes[inputIndex + 1] << 8) | bytes[inputIndex + 2];",
      "    output[outputIndex] = CODES[(value >> 18) & 0x3F];",
      "    output[outputIndex + 1] = CODES[(value >> 12) & 0x3F];",
      "    output[outputIndex + 2] = CODES[(value >> 6) & 0x3F];",
      "    output[outputIndex + 3] = CODES[value & 0x3F];",
      "    inputIndex += 3;",
      "    outputIndex += 4;",
      "  }",
      "  if (inputIndex < bytes.length) {",
      "    const remaining = bytes.length - inputIndex;",
      "    const value = (bytes[inputIndex] << 16) | (remaining === 2 ? bytes[inputIndex + 1] << 8 : 0);",
      "    output[outputIndex] = CODES[(value >> 18) & 0x3F];",
      "    output[outputIndex + 1] = CODES[(value >> 12) & 0x3F];",
      "    output[outputIndex + 2] = remaining === 2 ? CODES[(value >> 6) & 0x3F] : 0x3D;",
      "    output[outputIndex + 3] = 0x3D;",
      "  }",
      "  return output;",
      "}",
      "self.onmessage = (event) => {",
      "  const { id, bytes } = event.data;",
      "  try {",
      "    const output = encode(new Uint8Array(bytes));",
      "    self.postMessage({ id, bytes: output }, [output.buffer]);",
      "  } catch (error) {",
      "    self.postMessage({ id, error: error instanceof Error ? error.message : String(error) });",
      "  }",
      "};",
    ].join("\n");
    const LITERAL_WORKER_SOURCE = [
      "const BYTE_ESCAPES = Array.from({ length: 256 }, (_, value) => '\\\\x' + value.toString(16).padStart(2, '0').toUpperCase());",
      "function asciiToLiteral(bytes, oneLine, charsPerLine) {",
      "  if (bytes.length === 0) return '\"\"';",
      "  const width = oneLine ? bytes.length : charsPerLine;",
      "  const lineCount = Math.ceil(bytes.length / width);",
      "  const lines = new Array(lineCount);",
      "  for (let lineIndex = 0; lineIndex < lineCount; lineIndex += 1) {",
      "    const start = lineIndex * width;",
      "    const end = Math.min(start + width, bytes.length);",
      "    let line = lineIndex === 0 ? '\"' : '';",
      "    for (let i = start; i < end; i += 8192) {",
      "      line += String.fromCharCode(...bytes.subarray(i, Math.min(i + 8192, end)));",
      "    }",
      "    lines[lineIndex] = end < bytes.length ? line + '\\\\z' : line + '\"';",
      "  }",
      "  return lines.join('\\n');",
      "}",
      "function bytesToLiteral(bytes, oneLine, bytesPerLine) {",
      "  if (bytes.length === 0) return '\"\"';",
      "  const width = oneLine ? bytes.length : bytesPerLine;",
      "  const lineCount = Math.ceil(bytes.length / width);",
      "  const lines = new Array(lineCount);",
      "  for (let lineIndex = 0; lineIndex < lineCount; lineIndex += 1) {",
      "    const start = lineIndex * width;",
      "    const end = Math.min(start + width, bytes.length);",
      "    let line = lineIndex === 0 ? '\"' : '';",
      "    for (let i = start; i < end; i += 1) {",
      "      line += BYTE_ESCAPES[bytes[i]];",
      "    }",
      "    lines[lineIndex] = end < bytes.length ? line + '\\\\z' : line + '\"';",
      "  }",
      "  return lines.join('\\n');",
      "}",
      "self.onmessage = (event) => {",
      "  const { id, bytes, ascii, oneLine, bytesPerLine, charsPerLine } = event.data;",
      "  try {",
      "    const input = new Uint8Array(bytes);",
      "    const text = ascii ? asciiToLiteral(input, oneLine, charsPerLine) : bytesToLiteral(input, oneLine, bytesPerLine);",
      "    self.postMessage({ id, text });",
      "  } catch (error) {",
      "    self.postMessage({ id, error: error instanceof Error ? error.message : String(error) });",
      "  }",
      "};",
    ].join("\n");
    const TEXT_ENCODER = new TextEncoder();
    const TEXT_DECODER = new TextDecoder();
    const BASE64_CODES = TEXT_ENCODER.encode("ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/");
    const EMPTY_ZSTD_FRAME = new Uint8Array([0x28, 0xB5, 0x2F, 0xFD, 0x20, 0x00]);
    const BYTE_ESCAPES = Array.from({ length: 256 }, (_, value) => (
      "\\x" + value.toString(16).padStart(2, "0").toUpperCase()
    ));
    let moduleEntries = [];
    let exportFileName = "module.rbxmx";
    let zstdSimplePromise = null;
    let zstdScriptPromise = null;
    let zstdWorkers = [];
    let zstdWorkerCursor = 0;
    let zstdWorkerRequestId = 0;
    let zstdWorkerUnavailable = false;
    const zstdWorkerRequests = new Map();
    let base64Workers = [];
    let base64WorkerCursor = 0;
    let base64WorkerRequestId = 0;
    let base64WorkerUnavailable = false;
    const base64WorkerRequests = new Map();
    let literalWorkers = [];
    let literalWorkerCursor = 0;
    let literalWorkerRequestId = 0;
    let literalWorkerUnavailable = false;
    const literalWorkerRequests = new Map();
    let isBusy = false;
    let isPreparingExport = false;
    let exportMetaRequest = 0;
    let compressionProgress = null;

    function setReady(ready) {
      exportBtn.disabled = !ready || isBusy || isPreparingExport;
    }

    function syncOptionAvailability() {
      const disabled = isBusy || isPreparingExport;
      fileInput.disabled = disabled;
      zstdToggle.disabled = disabled;
      base64Toggle.disabled = disabled;
      returnBufferToggle.disabled = disabled;
      oneLineToggle.disabled = disabled;
    }

    function setBusy(busy) {
      isBusy = busy;
      syncOptionAvailability();
      setReady(moduleEntries.length > 0);
    }

    function setPreparingExport(preparing) {
      isPreparingExport = preparing;
      syncOptionAvailability();
      setReady(moduleEntries.length > 0);
    }

    function getPendingZstdCompressionCount() {
      if (!zstdToggle.checked) {
        return 0;
      }

      return moduleEntries.reduce((count, entry) => count + (entry.zstdBytes === null ? 1 : 0), 0);
    }

    function beginCompressionProgress(total, restoreText) {
      if (total <= 0) {
        compressionProgress = null;
        return;
      }

      compressionProgress = { done: 0, total, restoreText };
      statusText.textContent = `Compressing 0/${total}`;
    }

    function completeCompressionProgressItem() {
      if (compressionProgress === null) {
        return;
      }

      compressionProgress.done += 1;
      statusText.textContent = `Compressing ${compressionProgress.done}/${compressionProgress.total}`;
    }

    function endCompressionProgress(restore) {
      if (compressionProgress === null) {
        return;
      }

      const restoreText = compressionProgress.restoreText;
      compressionProgress = null;
      if (restore) {
        statusText.textContent = restoreText;
      }
    }

    function resetFile() {
      exportMetaRequest += 1;
      setPreparingExport(false);
      endCompressionProgress(false);
      moduleEntries = [];
      exportFileName = "module.rbxmx";
      fileName.textContent = "Nothing loaded";
      fileName.title = "";
      fileSize.textContent = "1 GB max";
      statusText.textContent = "Choose a file or ZIP. Export creates ModuleScripts that return the original bytes as a string or buffer.";
      exportMeta.textContent = "RBXMX";
      setReady(false);
    }

    function getBaseName(name) {
      const dotIndex = name.lastIndexOf(".");
      return dotIndex > 0 ? name.slice(0, dotIndex) : name;
    }

    function getDownloadName(name) {
      const safeName = (name || "module")
        .replace(/[\\/:*?"<>|\x00-\x1F]/g, "_")
        .replace(/[. ]+$/g, "");
      return `${safeName || "module"}.rbxmx`;
    }

    function getLeafName(name) {
      const normalized = name.replaceAll("\\", "/");
      const slashIndex = normalized.lastIndexOf("/");
      return slashIndex >= 0 ? normalized.slice(slashIndex + 1) : normalized;
    }

    function xmlEscape(text) {
      return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&apos;");
    }

    function cdataEscape(text) {
      return text.replaceAll("]]>", "]]]]><![CDATA[>");
    }

    function formatBytes(bytes) {
      if (bytes < 1024) return `${bytes} B`;

      const units = ["KB", "MB", "GB"];
      let value = bytes / 1024;
      let unitIndex = 0;

      while (value >= 1024 && unitIndex < units.length - 1) {
        value /= 1024;
        unitIndex += 1;
      }

      return `${value >= 10 ? value.toFixed(0) : value.toFixed(1)} ${units[unitIndex]}`;
    }

    function getSourceSize(byteCount) {
      if (byteCount === 0) return 9;

      const lineBreakSize = oneLineToggle.checked ? 0 : (Math.ceil(byteCount / BYTES_PER_LINE) - 1) * 3;
      return 9 + byteCount * 4 + lineBreakSize;
    }

    function getLiteralSize(byteCount) {
      if (byteCount === 0) return 2;

      const lineBreakSize = oneLineToggle.checked ? 0 : (Math.ceil(byteCount / BYTES_PER_LINE) - 1) * 3;
      return 2 + byteCount * 4 + lineBreakSize;
    }

    function getAsciiLiteralSize(byteCount) {
      if (byteCount === 0) return 2;

      const lineBreakSize = oneLineToggle.checked ? 0 : (Math.ceil(byteCount / BASE64_CHARS_PER_LINE) - 1) * 3;
      return 2 + byteCount + lineBreakSize;
    }

    function getUtf8Size(text) {
      return TEXT_ENCODER.encode(text).length;
    }

    function isZipBytes(bytes) {
      return bytes.length >= 4
        && bytes[0] === 0x50
        && bytes[1] === 0x4B
        && bytes[2] === 0x03
        && bytes[3] === 0x04;
    }

    function readU16(view, offset) {
      return view.getUint16(offset, true);
    }

    function readU32(view, offset) {
      return view.getUint32(offset, true);
    }

    function findZipEnd(view) {
      const minOffset = Math.max(0, view.byteLength - 65557);
      for (let offset = view.byteLength - 22; offset >= minOffset; offset -= 1) {
        if (readU32(view, offset) === 0x06054B50) {
          return offset;
        }
      }
      return -1;

    async function extractZipEntries(bytes) {
      const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
      const endOffset = findZipEnd(view);
      if (endOffset < 0) {
        throw new Error("Could not find ZIP directory.");
      }

      if (readU16(view, endOffset + 4) !== 0 || readU16(view, endOffset + 6) !== 0) {
        throw new Error("Multi-disk ZIP files are not supported.");
      }

      const entryCount = readU16(view, endOffset + 10);
      const centralOffset = readU32(view, endOffset + 16);
      if (entryCount === 0xFFFF || centralOffset === 0xFFFFFFFF) {
        throw new Error("ZIP64 files are not supported.");
      }

      const entries = [];
      const nameCounts = new Map();
      let totalBytes = 0;
      let cursor = centralOffset;

      for (let index = 0; index < entryCount; index += 1) {
        if (readU32(view, cursor) !== 0x02014B50) {
          throw new Error("ZIP directory is invalid.");
        }

        const flags = readU16(view, cursor + 8);
        const method = readU16(view, cursor + 10);
        const compressedSize = readU32(view, cursor + 20);
        const uncompressedSize = readU32(view, cursor + 24);
        const nameLength = readU16(view, cursor + 28);
        const extraLength = readU16(view, cursor + 30);
        const commentLength = readU16(view, cursor + 32);
        const localOffset = readU32(view, cursor + 42);
        if (compressedSize === 0xFFFFFFFF || uncompressedSize === 0xFFFFFFFF || localOffset === 0xFFFFFFFF) {
          throw new Error("ZIP64 files are not supported.");
        }

        const rawName = bytes.subarray(cursor + 46, cursor + 46 + nameLength);
        const zipName = TEXT_DECODER.decode(rawName);
        cursor += 46 + nameLength + extraLength + commentLength;

        if (zipName.endsWith("/")) {
          continue;
        }
        if (flags & 0x01) {
          throw new Error("Encrypted ZIP entries are not supported.");
        }
        if (method !== 0 && method !== 8) {
          throw new Error(`Unsupported ZIP compression method: ${method}.`);
        }

        totalBytes += uncompressedSize;
        if (totalBytes > MAX_FILE_BYTES) {
          throw new Error("Extracted ZIP content is larger than 1 GB.");
        }

        if (readU32(view, localOffset) !== 0x04034B50) {
          throw new Error("ZIP file header is invalid.");
        }

        const localNameLength = readU16(view, localOffset + 26);
        const localExtraLength = readU16(view, localOffset + 28);
        const dataOffset = localOffset + 30 + localNameLength + localExtraLength;
        const compressedBytes = bytes.subarray(dataOffset, dataOffset + compressedSize);
        const fileBytes = method === 0 ? compressedBytes : await inflateRaw(compressedBytes);
        if (fileBytes.length !== uncompressedSize) {
          throw new Error("ZIP entry size does not match its directory record.");
        }

        const baseName = getBaseName(getLeafName(zipName));
        entries.push({
          name: makeUniqueName(baseName || "ModuleScript", nameCounts),
          bytes: fileBytes,
          zstdBytes: null,
          zstdPromise: null,
          encodedBytes: null,
          encodedKey: "",
          sourceText: null,
          sourceKey: "",
        });
      }

      if (entries.length === 0) {
        throw new Error("ZIP file has no files to export.");
      }

      return entries;
    }

    async function getRbxmxParts() {
      const parts = [RBXMX_HEADER];
      const sourceTexts = await Promise.all(moduleEntries.map((entry) => getEntrySourceText(entry)));

      for (let index = 0; index < moduleEntries.length; index += 1) {
        const entry = moduleEntries[index];
        parts.push(
          ITEM_SOURCE_PREFIX,
          cdataEscape(sourceTexts[index]),
          ITEM_NAME_PREFIX,
          xmlEscape(entry.name),
          ITEM_SUFFIX,
        );
      }

      parts.push(RBXMX_FOOTER);
      return parts;

    function getTransformKey() {

    function getEntrySourceSize(entry) {
      const payloadBytes = getEntryPayloadBytes(entry);
      if (payloadBytes === null) {

      if (!zstdToggle.checked && !base64Toggle.checked) {
        let size = getUtf8Size(RETURN_PREFIX) + getLiteralSize(payloadBytes.length);
        if (returnBufferToggle.checked) {
          size += getUtf8Size(BUFFER_FROMSTRING_PREFIX) + 1;

        return size;
      }

      const payloadLiteralSize = base64Toggle.checked
        ? getAsciiLiteralSize(payloadBytes.length)
        : getLiteralSize(payloadBytes.length);

      let size = getUtf8Size(ENCODING_SERVICE_SOURCE)
        + getUtf8Size(RETURN_PREFIX)
        + getUtf8Size(BUFFER_FROMSTRING_PREFIX)
        + payloadLiteralSize
        + 1;

      if (base64Toggle.checked) {
        size += getUtf8Size(BASE64_DECODE_PREFIX) + 1;
      }

      if (zstdToggle.checked) {
        size += getUtf8Size(ZSTD_DECODE_PREFIX) + getUtf8Size(ZSTD_DECODE_SUFFIX);
      }

      if (!returnBufferToggle.checked) {
        size += getUtf8Size(BUFFER_TOSTRING_PREFIX) + 1;
      }

      return size;

    function getRbxmxSize(entries) {
      let size = getUtf8Size(RBXMX_HEADER) + getUtf8Size(RBXMX_FOOTER);

      for (const entry of entries) {
        const entrySourceSize = getEntrySourceSize(entry);
        if (entrySourceSize === null) {
          return null;
        }

        size += getUtf8Size(ITEM_SOURCE_PREFIX)
          + entrySourceSize
          + getUtf8Size(ITEM_NAME_PREFIX)
          + getUtf8Size(xmlEscape(entry.name))
          + getUtf8Size(ITEM_SUFFIX);
      }

      return size;
    }

    function bytesToLiteralText(bytes) {
      if (bytes.length === 0) return `""`;

      const bytesPerLine = oneLineToggle.checked ? bytes.length : BYTES_PER_LINE;
      const lineCount = Math.ceil(bytes.length / bytesPerLine);
      const lines = new Array(lineCount);

      for (let lineIndex = 0; lineIndex < lineCount; lineIndex += 1) {
        const start = lineIndex * bytesPerLine;
        const end = Math.min(start + bytesPerLine, bytes.length);
        let line = lineIndex === 0 ? `"` : "";

        for (let i = start; i < end; i += 1) {
          line += BYTE_ESCAPES[bytes[i]];

        lines[lineIndex] = end < bytes.length ? line + "\\z" : line + `"`;
      }

      return lines.join("\n");

    function asciiBytesToLiteralText(bytes) {
      if (bytes.length === 0) return `""`;

      const charsPerLine = oneLineToggle.checked ? bytes.length : BASE64_CHARS_PER_LINE;
      const lineCount = Math.ceil(bytes.length / charsPerLine);
      const lines = new Array(lineCount);

      for (let lineIndex = 0; lineIndex < lineCount; lineIndex += 1) {
        const start = lineIndex * charsPerLine;
        const end = Math.min(start + charsPerLine, bytes.length);
        let line = lineIndex === 0 ? `"` : "";

    function base64EncodeBytes(bytes) {

      let outputIndex = 0;

        const value = (bytes[inputIndex] << 16)
          | (bytes[inputIndex + 1] << 8)
          | bytes[inputIndex + 2];
        output[outputIndex] = BASE64_CODES[value >> 18 & 0x3F];
        output[outputIndex + 1] = BASE64_CODES[value >> 12 & 0x3F];
        output[outputIndex + 2] = BASE64_CODES[value >> 6 & 0x3F];
        output[outputIndex + 3] = BASE64_CODES[value & 0x3F];
        inputIndex += 3;
        outputIndex += 4;
      }

      if (inputIndex < bytes.length) {
        const remaining = bytes.length - inputIndex;
        const value = bytes[inputIndex] << 16
          | (remaining === 2 ? bytes[inputIndex + 1] << 8 : 0);
        output[outputIndex] = BASE64_CODES[value >> 18 & 0x3F];
        output[outputIndex + 1] = BASE64_CODES[value >> 12 & 0x3F];
        output[outputIndex + 2] = remaining === 2 ? BASE64_CODES[value >> 6 & 0x3F] : 0x3D;
        output[outputIndex + 3] = 0x3D;

      return output;

    function rejectLiteralWorkerRequests(error) {

    async function getEntryZstdBytes(entry) {

            entry.zstdPromise = null;

            throw error;

        return entry.zstdPromise;
      }

      return entry.zstdBytes;
    }

    async function getEntryEncodedBytes(entry) {
      const encodingKey = getEncodingKey();
      if (!zstdToggle.checked && !base64Toggle.checked) {
        return entry.bytes;

        return entry.encodedBytes;

      let payloadBytes = entry.bytes;
      if (zstdToggle.checked) {
        payloadBytes = await getEntryZstdBytes(entry);
      }

      if (base64Toggle.checked) {
        payloadBytes = await encodeBase64Bytes(payloadBytes);
      }

      entry.encodedBytes = payloadBytes;
      entry.encodedKey = encodingKey;
      return payloadBytes;

          ? BUFFER_FROMSTRING_PREFIX + payloadLiteralText + ")"

        return RETURN_PREFIX + expression;

      let expression = BUFFER_FROMSTRING_PREFIX + payloadLiteralText + ")";

      if (base64Toggle.checked) {
        expression = BASE64_DECODE_PREFIX + expression + ")";
      }

      if (zstdToggle.checked) {
        expression = ZSTD_DECODE_PREFIX + expression + ZSTD_DECODE_SUFFIX;
      }

      if (!returnBufferToggle.checked) {
        expression = BUFFER_TOSTRING_PREFIX + expression + ")";
      }

      return ENCODING_SERVICE_SOURCE + RETURN_PREFIX + expression;

        entry.sourceKey = sourceKey;
      }

      return entry.sourceText;
    }

    function refreshExportMeta() {
      if (moduleEntries.length === 0) {
        exportMeta.textContent = "RBXMX";
        return;

      const rbxmxSize = getRbxmxSize(moduleEntries);
      exportMeta.textContent = rbxmxSize === null ? "Encode" : formatBytes(rbxmxSize);
    }

    function clearEncodedCaches(refresh = true) {
      for (const entry of moduleEntries) {
        entry.encodedBytes = null;
        entry.encodedKey = "";
        entry.sourceText = null;
        entry.sourceKey = "";
      }

      if (refresh) {
        refreshExportMeta();
      }
    }

    function clearSourceCaches(refresh = true) {
      for (const entry of moduleEntries) {
        entry.sourceText = null;
        entry.sourceKey = "";
      }

      if (refresh) {
        refreshExportMeta();
      }
    }

    function hasMissingEncodedPayloads() {
      if (!zstdToggle.checked && !base64Toggle.checked) {
        return false;
      }

      const encodingKey = getEncodingKey();
      return moduleEntries.some((entry) => (
        entry.encodedBytes === null || entry.encodedKey !== encodingKey

    }

    function waitForPaint() {
      return new Promise((resolve) => {
        if (typeof requestAnimationFrame === "function") {
          requestAnimationFrame(resolve);
          return;
        }

        setTimeout(resolve, 0);
      });
    }

    async function refreshExportMetaRealtime() {
      const request = ++exportMetaRequest;
      if (moduleEntries.length === 0 || !hasMissingEncodedPayloads()) {
        setPreparingExport(false);
        endCompressionProgress(false);
        refreshExportMeta();
        return;
      }

      const previousStatus = statusText.textContent;
      const pendingCompressionCount = getPendingZstdCompressionCount();
      setPreparingExport(true);
      exportMeta.textContent = "Sizing";
      beginCompressionProgress(pendingCompressionCount, previousStatus);
      await waitForPaint();

      try {
        await Promise.all(moduleEntries.map(async (entry) => {
          if (request !== exportMetaRequest) return null;
          return getEntryEncodedBytes(entry);
        }));

        if (request === exportMetaRequest) {
          refreshExportMeta();
        }
      } catch (error) {
        if (request === exportMetaRequest) {
          exportMeta.textContent = "Encode";
        }
      } finally {
        if (request === exportMetaRequest) {
          endCompressionProgress(true);
          setPreparingExport(false);
        }
      }

      const url = URL.createObjectURL(blob);

      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    fileInput.addEventListener("change", async (event) => {
      const file = event.target.files?.[0];
      if (!file) return;
      if (file.size > MAX_FILE_BYTES) {
        alert("Max file size is 1 GB.");
        fileInput.value = "";
        resetFile();
        return;
      }

      setReady(false);

      try {
        const buffer = await file.arrayBuffer();
        const bytes = new Uint8Array(buffer);
        const baseName = getBaseName(file.name);

        if (isZipBytes(bytes)) {
          moduleEntries = await extractZipEntries(bytes);
          const extractedSize = moduleEntries.reduce((total, entry) => total + entry.bytes.length, 0);
          fileSize.textContent = `${moduleEntries.length.toLocaleString()} files`;
          statusText.textContent = `${formatBytes(extractedSize)} extracted.`;
        } else {
          moduleEntries = [{
            name: baseName || "ModuleScript",
            bytes,
            zstdBytes: null,
            zstdPromise: null,
            encodedBytes: null,
            encodedKey: "",
            sourceText: null,
            sourceKey: "",
          }];
          fileSize.textContent = `${formatBytes(bytes.length)} file`;
          statusText.textContent = `${bytes.length.toLocaleString()} bytes ready.`;
        }

        exportFileName = getDownloadName(baseName);
        fileName.textContent = file.name;
        fileName.title = file.name;
        setReady(true);
        refreshExportMetaRealtime();
      } catch (error) {
        alert(error instanceof Error ? error.message : "Could not read file.");
        fileInput.value = "";
        resetFile();
      }
    });

    exportBtn.addEventListener("click", async () => {
      const previousStatus = statusText.textContent;
      setBusy(true);
      statusText.textContent = "Encoding payload...";
      beginCompressionProgress(getPendingZstdCompressionCount(), "Encoding payload...");
      await waitForPaint();

      try {
        const parts = await getRbxmxParts();
        refreshExportMeta();
        downloadTextFile(exportFileName, parts);
        statusText.textContent = `Exported ${exportMeta.textContent}.`;
      } catch (error) {
        const message = error instanceof Error ? error.message : String(error || "Could not export file.");
        alert(message);
        statusText.textContent = previousStatus;
      } finally {
        endCompressionProgress(false);
        setBusy(false);
      }
    });

    zstdToggle.addEventListener("change", () => {
      clearEncodedCaches(false);
      refreshExportMetaRealtime();
    });
    base64Toggle.addEventListener("change", () => {
      clearEncodedCaches(false);
      refreshExportMetaRealtime();
    });
    returnBufferToggle.addEventListener("change", () => {
      clearSourceCaches(false);
      refreshExportMetaRealtime();
    });
    oneLineToggle.addEventListener("change", () => {
      clearSourceCaches(false);
      refreshExportMetaRealtime();
    });
    syncOptionAvailability();
  </script>
</body>
</html>
